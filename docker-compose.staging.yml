services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - staging_postgres:/var/lib/postgresql/data

  api:
    image: class-schedule-api:phase6-20260827@sha256:f10ad5d7e8ff28ef0b3167111daa687db2d44af1be0679aeb6fede19e37a9a2c
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SERVER_PORT: 8080
      APP_AUTH_BOOTSTRAP_USERNAME: ${APP_AUTH_BOOTSTRAP_USERNAME:?APP_AUTH_BOOTSTRAP_USERNAME is required}
      APP_AUTH_BOOTSTRAP_PASSWORD: ${APP_AUTH_BOOTSTRAP_PASSWORD:?APP_AUTH_BOOTSTRAP_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: class-schedule-api:phase6-20260827@sha256:f10ad5d7e8ff28ef0b3167111daa687db2d44af1be0679aeb6fede19e37a9a2c
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'class-schedule-backend' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: class-schedule-frontend:phase6-20260827@sha256:4df9f05b07686a57dcc76a2e476a52a2817b573c6589ae3de0e3196d12ca1d91
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STAGING_FRONTEND_PORT:-5174}:8080"

volumes:
  staging_postgres:
