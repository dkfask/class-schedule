services:
  postgres:
    image: postgres:16-alpine
    container_name: class-schedule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - class_schedule_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-schedule-api
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SERVER_PORT: 8080
      APP_AUTH_BOOTSTRAP_USERNAME: ${APP_AUTH_BOOTSTRAP_USERNAME:-}
      APP_AUTH_BOOTSTRAP_PASSWORD: ${APP_AUTH_BOOTSTRAP_PASSWORD:-}
      APP_AUTH_REGISTRATION_ENABLED: ${APP_AUTH_REGISTRATION_ENABLED:-false}
      APP_AUTH_REGISTRATION_DEFAULT_ROLE: ${APP_AUTH_REGISTRATION_DEFAULT_ROLE:-PLANNER}
      APP_AUTH_EMAIL_CODE_SECRET: ${APP_AUTH_EMAIL_CODE_SECRET:-change-this-email-code-secret}
      APP_AUTH_EMAIL_RESEND_INTERVAL: ${APP_AUTH_EMAIL_RESEND_INTERVAL:-60s}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@class-schedule.local}
      APP_PDF_FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
      APP_PDF_FONT_NAME: WenQuanYiMicroHei
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_MODEL: ${APP_AI_MODEL:-}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-schedule-worker
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  class_schedule_postgres:
