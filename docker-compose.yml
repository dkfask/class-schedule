services:
  postgres:
    image: postgres:16-alpine
    container_name: class-schedule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-class_schedule}
      POSTGRES_USER: ${POSTGRES_USER:-class_schedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-class_schedule}
    ports:
      - "5432:5432"
    volumes:
      - class_schedule_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-schedule-api
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/class_schedule
      DATABASE_USERNAME: ${POSTGRES_USER:-class_schedule}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-class_schedule}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-schedule-worker
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://postgres:5432/class_schedule
      DATABASE_USERNAME: ${POSTGRES_USER:-class_schedule}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-class_schedule}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  class_schedule_postgres:
