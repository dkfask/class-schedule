spring:
  application:
    name: class-schedule-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/class_schedule}
    username: ${DATABASE_USERNAME:class_schedule}
    password: ${DATABASE_PASSWORD:class_schedule}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    test-connection: false
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${SMTP_TIMEOUT:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT:5000}

server:
  port: ${SERVER_PORT:8080}

app:
  solver:
    termination-spent: ${SOLVER_TERMINATION_SPENT:30s}
    # 多线程移动(AUTO)是 Timefold 企业版权凭特性，社区版保持 NONE
    move-thread-count: ${SOLVER_MOVE_THREAD_COUNT:NONE}
  auth:
    bootstrap:
      username: ${APP_AUTH_BOOTSTRAP_USERNAME:}
      password: ${APP_AUTH_BOOTSTRAP_PASSWORD:}
    registration:
      enabled: ${APP_AUTH_REGISTRATION_ENABLED:false}
      default-role: ${APP_AUTH_REGISTRATION_DEFAULT_ROLE:PLANNER}
    email:
      code-ttl: ${APP_AUTH_EMAIL_CODE_TTL:10m}
      resend-interval: ${APP_AUTH_EMAIL_RESEND_INTERVAL:60s}
      max-attempts: ${APP_AUTH_EMAIL_MAX_ATTEMPTS:5}
      code-secret: ${APP_AUTH_EMAIL_CODE_SECRET:change-this-email-code-secret}
      from: ${MAIL_FROM:no-reply@class-schedule.local}
  pdf:
    font-path: ${APP_PDF_FONT_PATH:}
    font-name: ${APP_PDF_FONT_NAME:}
  ai:
    base-url: ${APP_AI_BASE_URL:}
    api-key: ${APP_AI_API_KEY:}
    model: ${APP_AI_MODEL:}
    config-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}

management:
  health:
    mail:
      enabled: ${app.auth.registration.enabled:false}
  endpoints:
    web:
      exposure:
        include: health,info
